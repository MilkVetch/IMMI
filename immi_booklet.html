<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMMI - Khee（黄芪）| 概念数字歌词本</title>

  <!-- 预连接解析与握手加速 -->
  <link rel="dns-prefetch" href="//music.163.com">
  <link rel="preconnect" href="https://music.163.com" crossorigin>
  <link rel="dns-prefetch" href="//m7.music.126.net">
  <link rel="dns-prefetch" href="//m8.music.126.net">
  <link rel="preconnect" href="https://m7.music.126.net" crossorigin>
  <link rel="preconnect" href="https://m8.music.126.net" crossorigin>

  <!-- 引入独立 JS 歌词文件 -->
  <script src="./lyrics/track01.js"></script>
  <script src="./lyrics/track02.js"></script>
  <script src="./lyrics/track03.js"></script>
  <script src="./lyrics/track04.js"></script>
  <script src="./lyrics/track05.js"></script>
  <script src="./lyrics/track06.js"></script>
  <script src="./lyrics/track07.js"></script>
  <script src="./lyrics/track08.js"></script>
  <script src="./lyrics/track09.js"></script>
  <script src="./lyrics/track10.js"></script>
  <script src="./lyrics/track11.js"></script>

  <style>
    :root {
      --bg-base: #0a0c0e;
      --theme-color: #c20c0c;
      --theme-glow: rgba(194, 12, 12, 0.25);
      --panel-bg: rgba(22, 27, 34, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --transition-speed: 0.35s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 85% 15%, var(--theme-glow) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(0, 0, 0, 0.5) 0%, transparent 55%);
      background-attachment: fixed;
      transition: background-color var(--transition-speed) ease;
    }

    aside {
      width: 290px;
      min-width: 290px;
      background: rgba(13, 16, 20, 0.95);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: hidden;
      z-index: 10;
    }

    .album-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .album-cover {
      width: 105px;
      height: 105px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      margin-bottom: 8px;
      background: #1c2128;
    }

    .album-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .album-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .album-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.82rem;
      border-radius: 20px;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .album-link-btn:hover {
      background: var(--theme-color);
      border-color: transparent;
      color: #fff;
    }

    /* 宽屏下的竖向列表导航 */
    .track-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .track-nav button {
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6.5px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }

    .track-nav button:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .track-nav button.active {
      background: var(--theme-glow);
      border-color: var(--theme-color);
      color: #fff;
      font-weight: 600;
    }

    /* 移动端专属下拉选择器：默认宽屏隐藏 */
    .mobile-track-select {
      display: none;
      width: 100%;
      background: #161b22;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      margin-top: 8px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%238b949e" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    main {
      flex: 1;
      padding: 36px 54px 80px;
      max-width: 880px;
      margin: 0 auto;
    }

    .track-section { display: none; }
    .track-section.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .track-header {
      display: flex;
      gap: 26px;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .track-cover {
      width: 140px;
      height: 140px;
      border-radius: 10px;
      object-fit: cover;
      background: #1c2128;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .track-meta { flex: 1; }

    .track-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .track-theme {
      color: var(--theme-color);
      font-size: 0.9rem;
      margin-bottom: 12px;
      font-weight: 500;
      transition: color var(--transition-speed);
    }

    /* 播放器容器（298px，微透磨砂） */
    .mini-player-box {
      width: 298px;
      height: 32px;
      border-radius: 6px;
      overflow: hidden;
      line-height: 0;
      font-size: 0;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
    }

    .mini-player-box:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .mini-player-box iframe {
      display: block;
      margin-top: -10px;
      opacity: 0.92;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
      transition: opacity 0.2s ease;
    }

    .mini-player-box:hover iframe {
      opacity: 1;
    }

    .lyrics-card {
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px 34px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .lyrics-view {
      font-family: inherit;
      white-space: pre-wrap;
      line-height: 1.95;
      font-size: 1rem;
      color: #dbe2ea;
    }

    .bottom-bar {
      position: fixed;
      bottom: 20px;
      right: 36px;
      display: flex;
      gap: 10px;
      background: rgba(18, 22, 28, 0.88);
      backdrop-filter: blur(14px);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      z-index: 100;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      background: var(--theme-color);
      color: #fff;
    }

    /* 竖屏与移动端响应式布局 */
    @media (max-width: 860px) {
      body {
        flex-direction: column;
        background-attachment: scroll;
      }
      aside {
        width: 100%;
        min-width: 100%;
        height: auto;
        position: static;
        overflow-y: visible;
        padding: 16px 16px 12px;
      }
      .album-header {
        display: flex;
        align-items: center;
        text-align: left;
        gap: 14px;
        margin-bottom: 8px;
      }
      .album-cover {
        width: 64px;
        height: 64px;
        margin-bottom: 0;
      }
      .album-link-btn {
        width: auto;
        padding: 4px 12px;
        margin-bottom: 0;
      }

      /* 隐藏横向滚动条，替换为纵向整齐的下拉选择器 */
      .track-nav {
        display: none !important;
      }
      .mobile-track-select {
        display: block !important;
      }

      main {
        padding: 16px 16px 85px;
      }
      .track-header {
        flex-direction: column;
        text-align: center;
        gap: 14px;
      }
      .mini-player-box {
        margin: 0 auto;
      }
      .bottom-bar {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        bottom: 14px;
        width: calc(100% - 32px);
        max-width: 360px;
        justify-content: space-around;
      }
    }
  </style>
</head>
<body>

  <!-- 侧边栏（移动竖屏时在顶部呈现专辑信息与下拉菜单） -->
  <aside>
    <div class="album-header">
      <img src="./covers/album_cover.png" alt="IMMI" class="album-cover" decoding="async" loading="eager" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'105\' height=\'105\'><rect fill=\'%23222\' width=\'105\' height=\'105\'/><text fill=\'%23666\' x=\'50%25\' y=\'50%25\' dominant-baseline=\'middle\' text-anchor=\'middle\'>IMMI</text></svg>'">
      <div>
        <h2 class="album-title">IMMI</h2>
        <p class="album-artist">Khee (黄芪)</p>
        <a href="https://music.163.com/#/album?id=399383669" target="_blank" class="album-link-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
          前往云音乐专辑页
        </a>
      </div>
    </div>

    <!-- 宽屏直列式导航 -->
    <ul class="track-nav" id="navList"></ul>

    <!-- 移动端竖屏专属下拉菜单 -->
    <select class="mobile-track-select" id="mobileSelect" onchange="switchSong(parseInt(this.value), true)"></select>
  </aside>

  <!-- 主内容展示区 -->
  <main id="mainContainer"></main>

  <!-- 底部控制器 -->
  <div class="bottom-bar">
    <button class="ctrl-btn" onclick="prevSong()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      上一首 (←)
    </button>
    <button class="ctrl-btn" onclick="nextSong()">
      下一首 (→)
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <script>
    const tracklist = [
      { id: "01", title: "Apply Online (2026)", theme: "数字炼狱 · 算法拒签", songId: "3441537277", fallbackColor: "#e63946" },
      { id: "02", title: "Lovely Little Trip", theme: "荒漠走线 · 黑色幽默", songId: "3441534950", fallbackColor: "#d4a373" },
      { id: "03", title: "Fujian Passport", theme: "海洋信仰 · 闽南民谣", songId: "3441829690", fallbackColor: "#2a9d8f" },
      { id: "04", title: "Just Call Me Raj", theme: "姓名缩略 · 身份折叠", songId: "3438799128", fallbackColor: "#f4a261" },
      { id: "05", title: "Where Are You REALLY From?", theme: "二代身份 · 刻板凝视", songId: "3441835905", fallbackColor: "#e76f51" },
      { id: "06", title: "Country With A Loading Face", theme: "卫星街景 · 数字幽灵乡", songId: "3441844001", fallbackColor: "#457b9d" },
      { id: "07", title: "IWWI", theme: "水面倒影 · 精神重构", songId: "3439817954", fallbackColor: "#1d3557" },
      { id: "08", title: "Out of Kaffa", theme: "咖啡越境 · 物性全球化", songId: "3441155620", fallbackColor: "#bc6c25" },
      { id: "09", title: "Fly Me to Mars", theme: "火星头等舱 · 阶级弃离", songId: "3441534728", fallbackColor: "#c1121f" },
      { id: "10", title: "No Thanks, I Use AI", theme: "直觉外包 · 算法寄生", songId: "3441164045", fallbackColor: "#7209b7" },
      { id: "11", title: "Who Drew the Line", theme: "终极和解 · 无界大地", songId: "3441853814", fallbackColor: "#588157" }
    ];

    let currentIndex = -1;
    const navList = document.getElementById("navList");
    const mobileSelect = document.getElementById("mobileSelect");
    const mainContainer = document.getElementById("mainContainer");

    // 全局常驻播放器实例（尺寸：298x52，有效高度32）
    const globalPlayer = document.createElement("iframe");
    globalPlayer.id = "shared-music-player";
    globalPlayer.setAttribute("frameborder", "no");
    globalPlayer.setAttribute("border", "0");
    globalPlayer.setAttribute("marginwidth", "0");
    globalPlayer.setAttribute("marginheight", "0");
    globalPlayer.setAttribute("width", "298");
    globalPlayer.setAttribute("height", "52");

    tracklist.forEach((track, index) => {
      // 1. 宽屏按钮列表
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.innerText = `${track.id}. ${track.title}`;
      if (index === 0) btn.classList.add("active");
      btn.onclick = () => switchSong(index, true);
      li.appendChild(btn);
      navList.appendChild(li);

      // 2. 移动端下拉列表选项
      const opt = document.createElement("option");
      opt.value = index;
      opt.innerText = `${track.id}. ${track.title}`;
      mobileSelect.appendChild(opt);

      // 3. 歌词文本获取
      const lyricsText = (window.TRACK_LYRICS && window.TRACK_LYRICS[track.id]) 
        ? window.TRACK_LYRICS[track.id] 
        : `[提示] 暂未获取到 ./lyrics/track${track.id}.js 的内容。请确认该文件已创建。`;

      const loadStrategy = (index === 0) ? 'loading="eager"' : 'loading="lazy"';

      const sec = document.createElement("section");
      sec.className = `track-section ${index === 0 ? "active" : ""}`;
      sec.id = `section-${index}`;
      sec.innerHTML = `
        <div class="track-header">
          <img id="cover-img-${index}" 
               src="./covers/track${track.id}.png" 
               class="track-cover" 
               decoding="async" 
               ${loadStrategy}
               onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'140\\' height=\\'140\\'><rect fill=\\'%231c2128\\' width=\\'140\\' height=\\'140\\'/><text fill=\\'%23666\\' x=\\'50%25\\' y=\\'50%25\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\'>Cover ${track.id}</text></svg>'">
          <div class="track-meta">
            <h1 class="track-title">${track.id}. ${track.title}</h1>
            <div class="track-theme">${track.theme}</div>
            <div class="mini-player-box" id="player-box-${index}"></div>
          </div>
        </div>
        <div class="lyrics-card">
          <div class="lyrics-view">${lyricsText}</div>
        </div>
      `;
      mainContainer.appendChild(sec);
    });

    function switchSong(index, autoPlay = true) {
      if (index < 0) index = tracklist.length - 1;
      if (index >= tracklist.length) index = 0;
      if (currentIndex === index) return;
      currentIndex = index;

      // 桌面导航选中高亮
      const navButtons = document.querySelectorAll(".track-nav button");
      navButtons.forEach((b, i) => {
        b.classList.toggle("active", i === index);
      });

      // 移动端下拉菜单同步更新
      mobileSelect.value = index;

      // 歌词卡片显隐
      document.querySelectorAll(".track-section").forEach((s, i) => {
        s.classList.toggle("active", i === index);
      });

      // 移动并复用单例播放器
      const targetBox = document.getElementById(`player-box-${index}`);
      if (targetBox) {
        const autoParam = autoPlay ? 1 : 0;
        const newSrc = `https://music.163.com/outchain/player?type=2&id=${tracklist[index].songId}&auto=${autoParam}&height=32`;
        
        if (globalPlayer.src !== newSrc) {
          globalPlayer.src = newSrc;
        }
        if (globalPlayer.parentNode !== targetBox) {
          targetBox.appendChild(globalPlayer);
        }
      }

      updatePaletteFromCover(index);
    }

    function prevSong() { switchSong(currentIndex - 1, true); }
    function nextSong() { switchSong(currentIndex + 1, true); }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevSong();
      if (e.key === "ArrowRight") nextSong();
    });

    function updatePaletteFromCover(index) {
      const img = document.getElementById(`cover-img-${index}`);
      const fallback = tracklist[index].fallbackColor || "#c20c0c";

      if (!img || !img.complete || img.naturalWidth === 0) {
        applyColor(fallback);
        return;
      }

      try {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 30;
        canvas.height = 30;
        ctx.drawImage(img, 0, 0, 30, 30);
        const data = ctx.getImageData(0, 0, 30, 30).data;
        
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 16) {
          const brightness = (data[i] * 299 + data[i+1] * 587 + data[i+2] * 114) / 1000;
          if (brightness > 35 && brightness < 220) {
            r += data[i];
            g += data[i+1];
            b += data[i+2];
            count++;
          }
        }

        if (count > 0) {
          const colorHex = `rgb(${Math.round(r/count)}, ${Math.round(g/count)}, ${Math.round(b/count)})`;
          applyColor(colorHex);
        } else {
          applyColor(fallback);
        }
      } catch (err) {
        applyColor(fallback);
      }
    }

    function applyColor(color) {
      document.documentElement.style.setProperty("--theme-color", color);
      document.documentElement.style.setProperty("--theme-glow", color.replace("rgb", "rgba").replace(")", ", 0.28)"));
    }

    window.addEventListener("DOMContentLoaded", () => {
      switchSong(0, false);
      setTimeout(() => updatePaletteFromCover(0), 200);
    });
  </script>
</body>
</html>
